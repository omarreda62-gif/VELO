<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة توريد جملة للصوصات | الدقهلية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    :root {
      --bg: #F5F5F4;

      --accent: #C7873B;
      --accent-dark: #A96E2A;
      --accent-soft: #FDF6EE;
      --ok-bg: #ECFDF5;
      --ok-fg: #047857;

      --warn-fg: #B45309;
      --off-bg: #FEF2F2;
      --off-fg: #B91C1C;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans Arabic", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    .num { font-variant-numeric: tabular-nums; }
    .container { max-width: 1260px; margin: 0 auto; padding: 0 16px; }
    header { position: sticky; top: 0; z-index: 30; background: var(--card); border-bottom: 1px solid var(--line); }
    .header-main { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
    .brand-title { margin: 0; font-size: 19px; font-weight: 700; }
    .brand-sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .header-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .zone-picker { display: flex; align-items: center; gap: 8px; background: #F4F4F5; border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; font-size: 13px; }
    .zone-picker select { border: none; background: transparent; font-family: inherit; font-weight: 700; color: var(--ink); cursor: pointer; outline: none; }
    .role-switch { display: inline-flex; background: #F4F4F5; border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
    .role-btn { border: none; background: transparent; color: #52525B; font-family: inherit; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 9px; cursor: pointer; }
    .role-btn.active-client { background: var(--ink); color: #fff; }
    .role-btn.active-admin { background: var(--accent); color: #fff; }
    .zone-banner { background: var(--accent-soft); border-top: 1px solid #F3D5AE; padding: 8px 0; font-size: 13px; }
    .zone-banner-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    main { padding: 20px 0 44px; }
    .client-grid { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(325px, 1fr); gap: 20px; align-items: start; }
    @media (max-width: 980px) { .client-grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .promo-hero { background: linear-gradient(135deg, #18181B 0%, #27272A 65%, #3B2814 100%); color: #fff; border-radius: 20px; padding: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    .promo-title { margin: 0; font-size: 19px; font-weight: 700; }
    .promo-sub { margin: 6px 0 0; font-size: 13px; color: #D4D4D8; max-width: 540px; }
    .search-input { width: 100%; padding: 12px 15px; border: 1px solid #D4D4D8; border-radius: 13px; font-family: inherit; font-size: 14px; outline: none; background: #FAFAF9; }
    .cats-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .cat-pill { border: 1px solid var(--line); background: #F4F4F5; color: #27272A; font-family: inherit; font-size: 13px; font-weight: 700; padding: 8px 15px; border-radius: 999px; cursor: pointer; }
    .cat-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .products-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    @media (max-width: 640px) { .products-grid { grid-template-columns: 1fr; } }
    .prod-card { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
    .prod-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .prod-meta { font-size: 12px; font-weight: 700; color: var(--accent-dark); }
    .prod-title { font-size: 16px; font-weight: 700; margin: 3px 0 0; }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .badge-available { background: var(--ok-bg); color: var(--ok-fg); }
    .badge-limited { background: var(--warn-bg); color: var(--warn-fg); }
    .badge-out_of_stock { background: var(--off-bg); color: var(--off-fg); }
    .tiers-box { background: #FAFAF9; border: 1px solid var(--line); border-radius: 13px; padding: 10px; margin-top: 10px; }
    .tiers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
    .tier-cell { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; }
    .tier-cell.active-tier { background: #FEF3C7; border-color: var(--accent); font-weight: 700; }
    .serving-strip { display: flex; justify-content: space-between; gap: 8px; background: #F4F4F5; border-radius: 11px; padding: 8px 12px; font-size: 12px; margin-top: 10px; }
    .prod-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid #F4F4F5; padding-top: 12px; }
    .price-now { font-size: 19px; font-weight: 700; }
